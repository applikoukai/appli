                <button disabled={state.phase !== 'wizard-action' || !canUseAction('earthquake') || state.gameOver || state.aiControl.wizard !== 'off' || state.pendingLightningStrike || state.pendingFireStrike} onClick={() => toggleAction('earthquake')} className={`h-10 rounded-xl border text-xl flex items-center justify-center transition-all ${state.activeAction === 'earthquake' ? 'border-amber-400 bg-amber-900/80 ring-2 ring-amber-500/50 text-white' : state.wizardActions.earthquake ? 'border-slate-800 bg-slate-950 text-slate-600 opacity-40' : 'border-slate-700 bg-slate-800/80 text-amber-200 hover:bg-slate-700'} disabled:opacity-30`}>🪨</button>
                <button disabled={state.phase !== 'wizard-action' || !canUseAction('lightning') || state.gameOver || state.aiControl.wizard !== 'off' || state.pendingLightningStrike || state.pendingFireStrike} onClick={() => toggleAction('lightning')} className={`h-10 rounded-xl border text-xl flex items-center justify-center transition-all ${state.activeAction === 'lightning' ? 'border-yellow-400 bg-yellow-900/80 ring-2 ring-yellow-500/50 text-white' : state.wizardActions.lightning ? 'border-slate-800 bg-slate-950 text-slate-600 opacity-40' : 'border-slate-700 bg-slate-800/80 text-yellow-200 hover:bg-slate-700'} disabled:opacity-30`}>⚡</button>
                <button disabled={state.phase !== 'wizard-action' || !canUseAction('fire') || state.gameOver || state.aiControl.wizard !== 'off' || state.pendingLightningStrike || state.pendingFireStrike} onClick={() => toggleAction('fire')} className={`h-10 rounded-xl border text-xl flex items-center justify-center transition-all ${state.activeAction === 'fire' ? 'border-red-400 bg-red-900/80 ring-2 ring-red-500/50 text-white' : state.wizardActions.fire ? 'border-slate-800 bg-slate-950 text-slate-600 opacity-40' : 'border-slate-700 bg-slate-800/80 text-red-200 hover:bg-slate-700'} disabled:opacity-30`}>🔥</button>
                <button disabled={state.phase !== 'wizard-action' || !canUseAction('golem') || state.gameOver || state.aiControl.wizard !== 'off' || state.pendingLightningStrike || state.pendingFireStrike} onClick={() => toggleAction('golem')} className={`h-10 rounded-xl border text-xl flex items-center justify-center transition-all ${state.activeAction === 'golem' ? 'border-stone-400 bg-stone-800 ring-2 ring-stone-400/50 text-white' : state.wizardActions.golem ? 'border-slate-800 bg-slate-950 text-slate-600 opacity-40' : 'border-slate-700 bg-slate-800/80 text-stone-200 hover:bg-slate-700'} disabled:opacity-30`}>🗿</button>
                </>
                )}
              </div>
            )}
          </div>
        </div>
      )}

      {state.showHelp && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
          <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-lg w-full text-slate-200 shadow-2xl max-h-[85vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
              <h2 className="text-xl font-bold text-sky-400 flex items-center gap-2">📖 ゲーム解説・取扱説明書</h2>
              <button onClick={() => mutate(s => ({ ...s, showHelp: false }))} className="text-slate-400 hover:text-white text-lg font-bold px-2 py-0.5 rounded-lg hover:bg-slate-800">✕</button>
            </div>
            <div className="space-y-4 text-xs sm:text-sm leading-relaxed text-slate-300">
              <section className="bg-slate-950/80 p-3 rounded-xl border border-slate-800 space-y-2 whitespace-pre-line">
{`⚔️ 国王軍の仕様と攻撃ルール
配置：国王軍駒はボードの上端および左端のマスに配置されます。
攻撃タイミング: 国王軍駒は「ターン開始時」「配置時」「移動後」に自動で攻撃します（魔法使いへは各駒1ターン1回のみ。複数ターゲットへの攻撃や複数ゴーレムの撃破は可能）。
歩兵: 縦横1マス移動・攻撃。HP1の魔法使いの同一マスに移動して撃破できる。
狙撃手: 縦横1〜2マス、斜め1マスに移動可能（ゴーレム以外を飛び越し可能）。縦横に数えて3マス以内に魔法使いがいれば攻撃。
騎兵: 縦横3マス移動（ゴーレム以外を飛び越し可能）。縦横1マス攻撃。移動経路の隣接マスにも攻撃。🎯が出ているゴーレム、HP1の魔法使いの同一マスに移動して撃破できる。

⚡ 魔法使いのルール
魔法使いは1ターンに別種の魔法を合計2回まで実行できます。
地震、雷、火炎は全て国王軍にだけ影響を与えます。
雷: 指定した1マスの敵を撃破。
地震マス: 地震の魔法が使用されると指定されたマスが地震マスになる。地震マスにいる駒は移動と攻撃を行えない。地震マスには1マスだけ入ることが出来るが、その場合、そのターンの移動後攻撃は行われない。地震マス化は国王ターン終了時に解消される。魔法使いは地震マスにいる間、テレポート以外の魔法を使用できない（別途「浮遊の魔法」が必要なため）。また、既に他の魔法を使用したターンに地震を使う場合、魔法使い自身のマスを含む範囲は選択できない。
火炎: 縦横直線または斜め45度に5マス攻撃。
ゴーレムの自動攻撃: 召喚時および魔法使いターン開始時に、上下左右に隣接する敵を自動的に撃破。
ゴーレムの撃破: ゴーレムは歩兵、騎兵、盤面の端、他のゴーレムと隣接すると🎯が表示される。🎯が出ている状態で、歩兵や騎兵が隣接すると撃破される。騎兵は🎯サインが出ているゴーレムの隣接マスを通過する、または同一マスに移動する事でも撃破できる。`}
              </section>
            </div>
            <button onClick={() => mutate(s => ({ ...s, showHelp: false }))} className="mt-6 w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl transition-colors text-sm shadow-lg">閉じる</button>
          </div>
        </div>
      )}

      {state.showSettings && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
          <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-slate-200 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
              <h2 className="text-xl font-bold text-sky-400 flex items-center gap-2">⚙️ ゲーム設定</h2>
              <button onClick={() => mutate(s => ({ ...s, showSettings: false }))} className="text-slate-400 hover:text-white text-lg font-bold px-2 py-0.5 rounded-lg hover:bg-slate-800">✕</button>
            </div>
            <div className="space-y-4 text-xs sm:text-sm">
              <div className="space-y-2 pb-2 border-b border-slate-800">
                <label className="block font-semibold text-slate-300">🤖 対戦モード</label>

                <div className="space-y-1">
                  <span className="text-[11px] font-semibold text-red-300">⚔️ 国王軍AI</span>
                  <div className="grid grid-cols-3 gap-1.5">
                    {[
                      { value: 'off', label: 'OFF' },
                      { value: 'weak', label: '弱' },
                      { value: 'normal', label: '強' },
                    ].map(opt => (
                      <button
                        key={opt.value}
                        onClick={() => mutate(s => ({ ...s, aiControl: { ...s.aiControl, king: opt.value } }))}
                        className={`py-2 rounded-xl border text-xs font-bold transition-colors ${
                          state.aiControl.king === opt.value ? 'border-red-500 bg-red-950/70 text-red-200' : 'border-slate-700 bg-slate-800/60 text-slate-300'
                        }`}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-1">
                  <span className="text-[11px] font-semibold text-purple-300">🧙‍♂️ 魔法使いAI</span>
                  <div className="grid grid-cols-3 gap-1.5">
                    {[
                      { value: 'off', label: 'OFF' },
                      { value: 'normal', label: '弱' },
                      { value: 'strong', label: '強' },
                    ].map(opt => (
                      <button
                        key={opt.value}
                        onClick={() => mutate(s => ({ ...s, aiControl: { ...s.aiControl, wizard: opt.value } }))}
                        className={`py-2 rounded-xl border text-xs font-bold transition-colors ${
                          state.aiControl.wizard === opt.value ? 'border-purple-500 bg-purple-950/70 text-purple-200' : 'border-slate-700 bg-slate-800/60 text-slate-300'
                        }`}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="space-y-1.5">
                <label className="block font-semibold text-slate-300">
                  制限ターン数: <span className="text-sky-400 font-bold">{state.maxTurns} ターン</span>
                </label>
                <input 
                  type="range" 
                  min="5" 
                  max="40" 
                  value={state.maxTurns} 
                  onChange={e => {
                    const val = parseInt(e.target.value);
                    mutate(s => ({ ...s, maxTurns: val }));
                  }} 
                  className="w-full accent-sky-500 cursor-pointer"
                />
                <div className="flex justify-between text-[10px] text-slate-500">
                  <span>5T (短期)</span>
                  <span>15T (標準)</span>
                  <span>40T (長期)</span>
                </div>
              </div>

              <div className="space-y-1.5 pt-2 border-t border-slate-800">
                <label className="block font-semibold text-slate-300">
                  魔法使いの最大 HP: <span className="text-red-400 font-bold">{state.maxHp} ❤️</span>
                </label>
                <input 
                  type="range" 
                  min="1" 
                  max="10" 
                  value={state.maxHp} 
                  onChange={e => {
                    const val = parseInt(e.target.value);
                    mutate(s => {
                      let nextPieces = s.pieces.map(p => p.type === 'wizard' ? { ...p, hp: Math.min(p.hp, val) } : p);
                      return { ...s, maxHp: val, pieces: nextPieces };
                    });
                  }} 
                  className="w-full accent-red-500 cursor-pointer"
                />
                <div className="flex justify-between text-[10px] text-slate-500">
                  <span>1 (ハード)</span>
                  <span>3 (標準)</span>
                  <span>10 (タフ)</span>
                </div>
              </div>

              <div className="space-y-1.5 pt-2 border-t border-slate-800">
                <label className="block font-semibold text-slate-300">
                  盤面サイズ: <span className="text-emerald-400 font-bold">{state.boardSize} x {state.boardSize}</span>
                </label>
                <input 
                  type="range" min="6" max="20" 
                  value={state.boardSize} 
                  onChange={e => {
                    const val = parseInt(e.target.value);
                    mutate(s => {
                       let nextPieces = s.pieces.map(p => {
                           if (p.type === 'wizard') {
                               return { ...p, x: Math.min(p.x, val - 1), y: Math.min(p.y, val - 1) };
                           }
                           return p;
                       }).filter(p => p.type === 'wizard' || (p.x < val && p.y < val));
                       let nextEarthquakes = s.earthquakes.filter(eq => eq.x < val && eq.y < val);
                       return { ...s, boardSize: val, pieces: nextPieces, earthquakes: nextEarthquakes };
                    });
                  }} 
                  className="w-full accent-emerald-500 cursor-pointer"
                />
                <div className="flex justify-between text-[10px] text-slate-500">
                  <span>6 (狭い)</span>
                  <span>10 (標準)</span>
                  <span>20 (広い)</span>
                </div>
              </div>

              <div className="space-y-1.5 pt-2 border-t border-slate-800">
                <div className="flex items-center justify-between">
                  <label className="block font-semibold text-slate-300">
                    盤面表示サイズ (縮小/拡大): <span className="text-indigo-400 font-bold">{state.zoomScale}%</span>
                  </label>
                  <button
                    onClick={fitZoomToScreen}
                    className="text-[11px] font-bold px-2 py-1 rounded-lg bg-indigo-950/60 border border-indigo-700/60 text-indigo-300 hover:bg-indigo-900/60 transition-colors shrink-0 ml-2"
                  >
                    📐 画面に合わせる
                  </button>
                </div>
                <input 
                  type="range" min="50" max="200" step="10"
                  value={state.zoomScale} 
                  onChange={e => mutate(s => ({ ...s, zoomScale: parseInt(e.target.value) }))} 
                  className="w-full accent-indigo-500 cursor-pointer"
                />
                <div className="flex justify-between text-[10px] text-slate-500">
                  <span>50%</span>
                  <span>100%</span>
                  <span>200%</span>
                </div>
              </div>
            </div>

            <div className="flex gap-2 mt-6">
              <button 
                onClick={() => mutate(s => ({ ...s, showSettings: false }))} 
                className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-colors text-xs"
              >
                閉じる (Close)
              </button>
              <button 
                onClick={() => {
                  commit(s => ({
                    ...s,
                    showSettings: false,
                    logs: [`Settings updated (Board: ${s.boardSize}, Zoom: ${s.zoomScale}%).`, ...s.logs].slice(0, 8)
                  }));
                }} 
                className="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl transition-colors text-xs shadow-lg"
              >
                変更を確定 (Apply)
              </button>
            </div>
            <button 
              onClick={() => resetGame(state.maxHp, state.maxTurns, state.boardSize)} 
              className="mt-2 w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl transition-colors text-xs shadow-lg"
            >
              設定を適用してリセット (Restart)
            </button>
          </div>
        </div>
      )}

      {state.gameOver && (
        <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4 backdrop-blur-md animate-fade-in">
          <div className="bg-slate-900 border-2 border-slate-700 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <h1 className={`text-3xl font-bold mb-4 ${state.gameOver === 'king' ? 'text-red-500' : 'text-purple-400'}`}>
              {state.gameOver === 'king' ? 'The King Wins' : 'The Wizard Survives'}
            </h1>
            <p className="text-slate-300 mb-6 text-sm leading-relaxed">
              {state.gameOver === 'king'
                ? 'The magic has faded. The kingdom wakes to a new dawn. "Our era has ended. Let us become the foundation of an orderly future, together."'
                : `${state.maxTurns} turns of siege broken! "Be this the recompense for bringing peace? Then let me wage war against the new Demon King—mankind itself."`}
            </p>

            <div className="flex flex-col gap-3">
              {appState.past.length > 0 && (
                <button onClick={undo} className="px-6 py-3 bg-amber-600/90 hover:bg-amber-500 border border-amber-400/50 rounded-xl font-bold text-white transition-all w-full shadow-lg text-sm active:scale-95 flex items-center justify-center gap-2">
                  ↺ 待った (Undo)
                </button>
              )}
              {state.gameOver === 'wizard' && (
                <button onClick={handleContinueEndless} className="px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 rounded-xl font-bold text-white transition-all w-full shadow-lg text-sm border border-purple-400/30 active:scale-95">
                  ⚔️ 続きをプレイ (Endless Mode)
                </button>
              )}
              <button onClick={() => resetGame()} className="px-6 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl font-bold text-slate-200 transition-all w-full shadow-lg text-sm active:scale-95">
                最初からやり直す (Play Again)
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
</html>
