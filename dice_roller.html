<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dice Roller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
            -webkit-tap-highlight-color: transparent;
        }

        /* Hide scrollbar for clean UI but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Dice shake animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .rolling {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            color: #9ca3af; /* Gray out during roll */
        }

        /* Modern shadow for bottom bar */
        .shadow-top {
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05), 0 -2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="h-screen w-full overflow-hidden text-gray-800 flex justify-center">

    <!-- Mobile container layout -->
    <div class="w-full max-w-md h-full flex flex-col bg-white shadow-xl relative">
        
        <!-- Header -->
        <header class="pt-6 pb-4 px-6 bg-white z-10 flex-shrink-0">
            <h1 class="text-xl font-bold text-center text-gray-800 tracking-wider">DICE ROLLER</h1>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-grow overflow-y-auto no-scrollbar px-6 pb-32 pt-2 flex flex-col gap-6">
            
            <!-- Result Area -->
            <div class="bg-gray-50 rounded-3xl p-6 flex flex-col items-center justify-center min-h-[160px] shadow-inner relative border border-gray-100">
                <div class="text-sm font-semibold text-gray-400 mb-1">合計 (TOTAL)</div>
                <div id="total-result" class="text-6xl font-bold text-indigo-600 transition-colors duration-200">0</div>
                
                <!-- Individual Dice Container -->
                <div id="individual-dice" class="flex flex-wrap justify-center gap-2 mt-4 w-full">
                    <!-- Dice will be injected here -->
                    <div class="w-10 h-10 rounded-lg bg-white shadow flex items-center justify-center text-lg font-bold text-gray-400 border border-gray-200">-</div>
                </div>
            </div>

            <!-- Controls Area -->
            <div class="flex flex-col gap-6 mt-2">
                
                <!-- Dice Count Control -->
                <div class="flex flex-col gap-3">
                    <label class="text-sm font-bold text-gray-600 flex justify-between items-center">
                        <span>振る数 (COUNT)</span>
                        <span class="text-xs text-gray-400 font-normal">Max 50</span>
                    </label>
                    <div class="flex items-center justify-between bg-gray-50 rounded-2xl p-2 border border-gray-100 shadow-sm">
                        <button id="btn-minus" class="w-14 h-14 rounded-xl bg-white text-gray-600 font-bold text-2xl shadow-sm hover:bg-gray-100 active:bg-gray-200 transition-colors flex items-center justify-center disabled:opacity-50 disabled:active:bg-white">
                            -
                        </button>
                        <div id="dice-count-display" class="text-3xl font-bold w-20 text-center">1</div>
                        <button id="btn-plus" class="w-14 h-14 rounded-xl bg-white text-gray-600 font-bold text-2xl shadow-sm hover:bg-gray-100 active:bg-gray-200 transition-colors flex items-center justify-center disabled:opacity-50 disabled:active:bg-white">
                            +
                        </button>
                    </div>
                </div>

                <!-- Dice Type Control -->
                <div class="flex flex-col gap-3">
                    <label class="text-sm font-bold text-gray-600">ダイスの種類 (SIDES)</label>
                    <div class="grid grid-cols-4 gap-3">
                        <button class="dice-type-btn active rounded-2xl py-3 font-bold text-lg transition-all border-2 border-indigo-600 bg-indigo-50 text-indigo-700 shadow-sm" data-sides="6">D6</button>
                        <button class="dice-type-btn rounded-2xl py-3 font-bold text-lg transition-all border-2 border-transparent bg-gray-50 text-gray-500 hover:bg-gray-100 active:bg-gray-200" data-sides="2">D2</button>
                        <button class="dice-type-btn rounded-2xl py-3 font-bold text-lg transition-all border-2 border-transparent bg-gray-50 text-gray-500 hover:bg-gray-100 active:bg-gray-200" data-sides="4">D4</button>
                        <button class="dice-type-btn rounded-2xl py-3 font-bold text-lg transition-all border-2 border-transparent bg-gray-50 text-gray-500 hover:bg-gray-100 active:bg-gray-200" data-sides="8">D8</button>
                        <button class="dice-type-btn rounded-2xl py-3 font-bold text-lg transition-all border-2 border-transparent bg-gray-50 text-gray-500 hover:bg-gray-100 active:bg-gray-200" data-sides="10">D10</button>
                        <button class="dice-type-btn rounded-2xl py-3 font-bold text-lg transition-all border-2 border-transparent bg-gray-50 text-gray-500 hover:bg-gray-100 active:bg-gray-200" data-sides="12">D12</button>
                        <button class="dice-type-btn rounded-2xl py-3 font-bold text-lg transition-all border-2 border-transparent bg-gray-50 text-gray-500 hover:bg-gray-100 active:bg-gray-200" data-sides="20">D20</button>
                        <button class="dice-type-btn rounded-2xl py-3 font-bold text-lg transition-all border-2 border-transparent bg-gray-50 text-gray-500 hover:bg-gray-100 active:bg-gray-200" data-sides="100">D100</button>
                    </div>
                </div>

            </div>
        </main>

        <!-- Fixed Bottom Action Bar -->
        <div class="absolute bottom-0 left-0 w-full bg-white/90 backdrop-blur-md p-6 shadow-top z-20 pb-8 rounded-t-3xl border-t border-gray-100">
            <button id="roll-btn" class="w-full bg-indigo-600 text-white rounded-2xl py-5 text-2xl font-bold shadow-lg shadow-indigo-200 active:bg-indigo-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 256 256"><path d="M184,32H72A40,40,0,0,0,32,72V184a40,40,0,0,0,40,40H184a40,40,0,0,0,40-40V72A40,40,0,0,0,184,32ZM76,88A12,12,0,1,1,88,76,12,12,0,0,1,76,88Zm0,92a12,12,0,1,1,12-12A12,12,0,0,1,76,180Zm52-40a12,12,0,1,1,12-12A12,12,0,0,1,128,140Zm52,40a12,12,0,1,1,12-12A12,12,0,0,1,180,180Zm0-92a12,12,0,1,1,12-12A12,12,0,0,1,180,88Z"></path></svg>
                ダイスを振る！
            </button>
        </div>

    </div>

    <script>
        // State
        let currentCount = 1;
        let currentSides = 6;
        let isRolling = false;
        const MAX_COUNT = 50;
        const MIN_COUNT = 1;

        // DOM Elements
        const countDisplay = document.getElementById('dice-count-display');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');
        const typeButtons = document.querySelectorAll('.dice-type-btn');
        const rollBtn = document.getElementById('roll-btn');
        const totalResultDisplay = document.getElementById('total-result');
        const individualDiceContainer = document.getElementById('individual-dice');

        // Initialize UI
        function updateCountUI() {
            countDisplay.textContent = currentCount;
            btnMinus.disabled = currentCount <= MIN_COUNT;
            btnPlus.disabled = currentCount >= MAX_COUNT;
            
            // Adjust font size if total possible goes too high, just a safeguard
            if(currentCount > 9) {
                totalResultDisplay.classList.remove('text-7xl');
                totalResultDisplay.classList.add('text-6xl');
            }
        }

        // Event Listeners for Count
        btnMinus.addEventListener('click', () => {
            if (currentCount > MIN_COUNT && !isRolling) {
                currentCount--;
                updateCountUI();
                vibrate(10);
            }
        });

        btnPlus.addEventListener('click', () => {
            if (currentCount < MAX_COUNT && !isRolling) {
                currentCount++;
                updateCountUI();
                vibrate(10);
            }
        });

        // Event Listeners for Dice Types
        typeButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(isRolling) return;
                
                // Remove active styling from all
                typeButtons.forEach(b => {
                    b.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-700');
                    b.classList.add('border-transparent', 'bg-gray-50', 'text-gray-500');
                });
                
                // Add active styling to clicked
                const target = e.currentTarget;
                target.classList.remove('border-transparent', 'bg-gray-50', 'text-gray-500');
                target.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-700');
                
                currentSides = parseInt(target.getAttribute('data-sides'));
                vibrate(10);
            });
        });

        // Haptic feedback helper
        function vibrate(duration) {
            if (navigator.vibrate) {
                navigator.vibrate(duration);
            }
        }

        // Rolling Logic
        function generateRandomRolls(count, sides) {
            const rolls = [];
            let total = 0;
            for (let i = 0; i < count; i++) {
                const roll = Math.floor(Math.random() * sides) + 1;
                rolls.push(roll);
                total += roll;
            }
            return { rolls, total };
        }

        function renderDice(rolls, isFinal = false) {
            individualDiceContainer.innerHTML = '';
            
            rolls.forEach(val => {
                const diceEl = document.createElement('div');
                // Adjust size based on count to fit better
                let sizeClass = currentCount > 20 ? 'w-8 h-8 text-sm' : 
                                currentCount > 10 ? 'w-10 h-10 text-base' : 'w-12 h-12 text-lg';
                
                diceEl.className = `${sizeClass} rounded-xl shadow-sm flex items-center justify-center font-bold border transition-all duration-200 ease-out`;
                
                if (isFinal) {
                    diceEl.classList.add('bg-white', 'text-gray-800', 'border-gray-200');
                    // Add a tiny pop animation on final result
                    diceEl.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        diceEl.style.transform = 'scale(1)';
                    }, 10);
                } else {
                    diceEl.classList.add('bg-gray-100', 'text-gray-400', 'border-gray-100');
                }
                
                diceEl.textContent = val;
                individualDiceContainer.appendChild(diceEl);
            });
        }

        rollBtn.addEventListener('click', () => {
            if (isRolling) return;
            
            isRolling = true;
            vibrate([20, 30, 20]);
            
            // UI setup for rolling
            rollBtn.disabled = true;
            rollBtn.classList.add('opacity-80');
            totalResultDisplay.classList.add('rolling');
            
            const animationDuration = 600; // ms
            const intervalTime = 50; // ms
            let elapsed = 0;
            
            // Dummy rolling animation
            const rollInterval = setInterval(() => {
                const fakeRolls = generateRandomRolls(currentCount, currentSides);
                totalResultDisplay.textContent = fakeRolls.total;
                renderDice(fakeRolls.rolls, false);
                
                elapsed += intervalTime;
                if (elapsed >= animationDuration) {
                    clearInterval(rollInterval);
                    finishRoll();
                }
            }, intervalTime);
            
        });

        function finishRoll() {
            // Calculate actual final result
            const finalResult = generateRandomRolls(currentCount, currentSides);
            
            // Update UI
            totalResultDisplay.classList.remove('rolling');
            totalResultDisplay.textContent = finalResult.total;
            renderDice(finalResult.rolls, true);
            
            // Stronger vibration for final result
            vibrate(50);
            
            // Reset state
            isRolling = false;
            rollBtn.disabled = false;
            rollBtn.classList.remove('opacity-80');
        }

        // Initial setup
        updateCountUI();

    </script>
</body>
</html>
